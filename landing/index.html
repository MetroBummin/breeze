<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Breeze</title>
  <meta name="description" content="이야기에 집중하세요. 나머지는 Breeze가 할게요.">
  <meta name="theme-color" content="#FAF8F2">
  <meta property="og:title" content="Breeze">
  <meta property="og:description" content="이야기에 집중하세요. 나머지는 Breeze가 할게요.">
  <meta property="og:image" content="../assets/favicon/icon-512.png">

  <link rel="icon" href="../assets/favicon/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="../assets/favicon/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">

  <!-- ================= 이 페이지는 앱을 읽기만 합니다 =================
       Breeze 앱(../index.html)은 이 폴더를 모릅니다. 여기서 아래 스타일을
       가져다 쓸 뿐이고, 화살표는 한 방향입니다 — 랜딩 → 앱. 그래서 이 폴더를
       통째로 지워도 앱은 한 글자도 달라지지 않습니다.

       베끼지 않고 링크하는 이유: 단어창·시트·낱말 상자를 복사해 두면 앱 쪽을
       고칠 때마다 조용히 어긋납니다. 랜딩에서 보는 단어창은 진짜 그 단어창이어야
       합니다. 랜딩이 따로 정하는 것은 "무대와 전환"뿐입니다(landing.css). -->
  <link rel="preload" href="../assets/fonts/fraunces-latin.woff2?v=48282a41" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/gowun-batang-ui-400.woff2?v=cb182529" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/gowun-batang-ui-700.woff2?v=8fbd485f" as="font" type="font/woff2" crossorigin>
  <!-- 첫 장면 그림은 앱의 스플래시와 같은 파일, 같은 규칙입니다(styles/base.css 의
       `#splash .splash-scene`). 화면 비율에 따라 세로·가로 중 한 벌만 받습니다. -->
  <link rel="preload" href="../assets/brand/breeze-day.avif" as="image" type="image/avif" media="(max-aspect-ratio: 4/3)">
  <link rel="preload" href="../assets/brand/breeze-day-wide.avif" as="image" type="image/avif" media="(min-aspect-ratio: 4/3)">

  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <!-- 종이·종이결·첫 장면 그림 -->
  <link rel="stylesheet" href="../styles/base.css">
  <!-- 본문 속 낱말(`.w`)의 모양과 문장이 파랗게 차오르는 색 -->
  <link rel="stylesheet" href="../styles/reader.css">
  <!-- 단어창과 바텀시트, 문장 해석 창 -->
  <link rel="stylesheet" href="../styles/dictionary.css">
  <!-- 저장했다고 알리는 한 줄(`#toast`) -->
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="landing.css">
</head>
<!-- `lang-ko` 는 앱과 같은 제목 글꼴 짝(Fraunces + 고운바탕)을 씁니다 — 로마자
     "Breeze" 는 Fraunces 로, 한글만 고운바탕으로 넘어갑니다(styles/tokens.css). -->
<body class="lang-ko" data-state="0">

<!-- ================= 첫 장면 그림 =================
     앱의 스플래시와 같은 뼈대입니다. 세로·가로 고르기, 그 위의 얇은 막,
     아주 느린 숨쉬기, 움직임을 줄여 달라는 설정까지 styles/base.css 에 이미
     들어 있어서 여기서는 자리만 다시 잡습니다(landing.css). -->
<div id="splash" class="splash-day" aria-hidden="true">
  <div class="splash-scene"></div>
</div>

<!-- ================= 무대 =================
     화면은 하나입니다. 스크롤은 그 하나를 네 장면으로 넘겨줄 뿐이라, 무대는
     `sticky` 로 제자리에 못 박혀 있고 그 바깥의 빈 레일만 길게 흐릅니다.
     스크롤 값에 붙어 움직이는 것은 이 페이지에 하나도 없습니다 — 장면이 바뀌는
     순간에만 `body[data-state]` 한 글자가 바뀌고, 나머지는 CSS 가 합니다. -->
<div id="rail">
  <div id="stage">
    <div id="copy">
      <!-- 두 줄의 자리는 네 장면 내내 같습니다. 바뀌는 것은 언어와, 그 뒤로
           물러나는 그림뿐입니다.

           둘째 줄의 `Breeze` 는 지워지지 않는 한 조각입니다. 한국어가 영어로
           바뀔 때 앞뒤 조각만 흐려졌다 돌아오고, 상표는 흐려지지 않습니다.
           자리를 재서 붙들어 두지는 않습니다 — 바뀌는 순간 주변이 비어 있어
           견줄 것이 없고, 끝까지 남아 있는 것은 상표 하나뿐입니다. -->
      <p class="lp-line">
        <span class="lp-sentence" data-s="1"><span class="lp-a"></span></span>
      </p>
      <p class="lp-line">
        <span class="lp-sentence" data-s="2"><span class="lp-a"></span><span
          class="lp-brand">Breeze</span><span class="lp-b"></span></span>
      </p>
      <!-- 조작 힌트입니다. 마케팅 문구가 아니라 "여기를 눌러도 됩니다" 한 줄이라,
           영어 문장보다 한참 약하게 두고 조금 늦게 옵니다. 깜빡이지 않습니다.
           두 줄 바로 아래에 붙여 두면 자리를 따로 잡을 일이 없고, 보이지 않는
           동안에도 자리를 지키므로 나타날 때 아무것도 밀지 않습니다. -->
      <div id="hint">단어를 눌러보세요 · 문장은 길게 눌러보세요</div>
    </div>
  </div>
</div>

<!-- ================= 단어창 =================
     앱의 단어창을 그대로 씁니다 — 같은 이름, 같은 CSS(styles/dictionary.css).
     넓은 화면에서는 옆에 뜨는 칸, 좁은 화면에서는 아래에서 올라오는 시트로
     바뀌는 것도 그 파일이 이미 정해 둔 경계 그대로입니다.

     새로 만든 줄은 하나도 없습니다. 빠진 것만 있습니다 — 계정과 단어장 관리에
     닿는 줄(모르는 정도 · 아는 단어 빼기 · 사전 링크 · 발음)은 여기 두지
     않습니다. 이 페이지가 보여 주는 것은 "모르는 낱말을 만난 그 순간" 하나이고,
     그 뒤의 일은 앱에서 시작합니다. -->
<div id="sheetbg"></div>
<div id="panel">
  <div id="p-handle"></div>
  <div class="inner">
    <div id="p-top">
      <div id="p-head">
        <div id="p-word"></div>
      </div>
      <button id="p-close" type="button" title="단어창 닫기" aria-label="단어창 닫기">✕</button>
    </div>
    <div id="p-ai">
      <div class="cap"><span class="dot"></span><span id="p-ai-cap-t">문맥 뜻 · AI</span>
        <span id="p-ai-saved" hidden>✓ 저장됨</span></div>
      <div class="m">
        <span class="mk" id="p-ai-ko"></span><span class="pos" id="p-ai-pos"></span>
      </div>
      <div class="note" id="p-ai-note"></div>
    </div>
    <div class="p-sec" id="p-alt-sec">추천 뜻</div>
    <div id="p-alts"></div>
    <div class="p-sec">영어 뜻</div>
    <div id="p-defs"></div>
    <div class="p-sec">저장된 예문</div>
    <div id="p-ex"></div>
  </div>
</div>

<!-- ================= 문장 해석 =================
     낱말을 꾹 누르면 그 문장이 파랗게 차오르고 화면 한가운데에 뜹니다. 앱과
     같은 손짓(1초 · 10px), 같은 창입니다. -->
<div id="sentence-modal" hidden>
  <div id="sentence-scrim"></div>
  <section id="p-sentence" role="dialog" aria-modal="true" aria-live="polite">
    <button id="ps-close" type="button" aria-label="문장 해석 닫기">✕</button>
    <div class="cap"><span class="dot"></span><span id="ps-cap">문장 통째로 · AI</span></div>
    <div id="ps-en"></div>
    <div id="ps-ko"></div>
    <ul id="ps-points"></ul>
  </section>
</div>

<div id="toast"></div>

<script src="landing.js"></script>
</body>
</html>
