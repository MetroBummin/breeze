<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>READY Admin · 고려에듀</title>
  <meta name="theme-color" content="#FAF8F2" media="(prefers-color-scheme:light)"><meta name="theme-color" content="#171816" media="(prefers-color-scheme:dark)">
  <link rel="icon" href="../../assets/favicon/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../styles/fonts.css"><link rel="stylesheet" href="../../styles/tokens.css"><link rel="stylesheet" href="../../styles/base.css"><link rel="stylesheet" href="../ready.css">
  <script defer src="../config.js"></script><script type="module" src="app.js?v=exam-refactor-1"></script>
</head>
<body data-ready-mode="admin">
<div id="app">
  <header id="topbar"><button id="logo" class="brand-button" type="button" data-route="students"><span class="mark">Ready</span><span class="family">Admin</span></button><nav id="admin-nav" hidden><button class="navbtn on" type="button" data-route="students">Students</button><button class="navbtn" type="button" data-route="exams">Exams</button><button class="navbtn" type="button" data-route="analytics">Review</button></nav><button id="theme-toggle" class="icon-button" type="button" aria-label="색상 모드 바꾸기">◐</button><button id="admin-logout" class="button quiet small" type="button" hidden>로그아웃</button></header>
  <main>
    <section id="admin-login" class="auth-wrap" aria-labelledby="admin-login-title"><form id="admin-login-form" class="card auth-card"><p class="eyebrow">READY ADMIN</p><h1 id="admin-login-title">관리자 로그인</h1><p class="lead">관리자 비밀번호는 로그인할 때 한 번만 서버에서 확인합니다.</p><label><span>관리자 비밀번호</span><input name="password" type="password" autocomplete="current-password" maxlength="200" required></label><button class="button primary" type="submit">관리자 화면 열기</button></form></section>
    <section class="view" id="v-students"><div class="page-head"><div><p class="eyebrow">STUDENTS</p><h1>학생 관리</h1></div><button id="refresh-admin" class="button quiet" type="button">새로고침</button></div><section class="card form-card"><div class="card-head"><div><span class="step">+</span><h2>학생 추가</h2></div></div><form id="create-student-form" class="form-grid student-create-school"><label><span>학생 이름</span><input name="name" maxlength="40" required></label><label><span>학교</span><select name="school" required><option value="신흥고">신흥고</option><option value="동고">동고</option><option value="중앙고">중앙고</option><option value="한빛고">한빛고</option></select></label><label><span>학년</span><select name="grade" required><option value="1학년">1학년</option><option value="2학년">2학년</option><option value="3학년">3학년</option></select></label><label><span>개인 PIN</span><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" autocomplete="new-password" required></label><button class="button primary" type="submit">학생 추가</button></form></section><div class="filter-toolbar"><label>학교<select id="student-school-filter"><option value="">전체</option><option>신흥고</option><option>동고</option><option>중앙고</option><option>한빛고</option></select></label><label>학년<select id="student-grade-filter"><option value="">전체</option><option>1학년</option><option>2학년</option><option>3학년</option></select></label></div><div id="admin-students"></div></section>
    <section class="view" id="v-exams"><div class="page-head"><div><p class="eyebrow">EXAMS</p><h1>시험범위와 지문</h1></div><button id="refresh-exams" class="button quiet" type="button">새로고침</button></div><form id="create-exam-form" class="card form-card"><div class="card-head"><div><span class="step">+</span><h2>새 Exam</h2></div></div><div class="form-grid exam-create"><label><span>학교</span><input name="school" maxlength="80" required></label><label><span>학년</span><input name="grade" maxlength="40" placeholder="고1" required></label><label><span>시험명</span><input name="title" maxlength="120" placeholder="2학기 중간고사" required></label><label><span>설명 <small>선택</small></span><input name="description" maxlength="500"></label></div><button class="button primary" type="submit">Exam 만들기</button></form><div id="teacher-exams"></div></section>
    <section class="view" id="v-analytics"><div class="page-head"><div><p class="eyebrow">ACTIONABLE REVIEW</p><h1>학생 학습 기록</h1></div><button id="refresh-analytics" class="button quiet" type="button">새로고침</button></div><div id="analytics-content"></div></section>
  </main>
</div>
<div id="question-modal" class="modal" aria-hidden="true"><div class="modal-scrim" data-close-modal></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="question-modal-title"><div class="sheet-head"><div><p class="eyebrow">ORDER PREVIEW</p><h2 id="question-modal-title">문제 검수</h2></div><button class="icon-button" type="button" data-close-modal aria-label="닫기">×</button></div><div id="question-editor"></div></section></div>
<div id="student-delete-modal" class="modal" aria-hidden="true"><div class="modal-scrim" data-close-student-delete></div><section class="sheet small-sheet" role="dialog" aria-modal="true" aria-labelledby="student-delete-title"><div class="sheet-head"><div><p class="eyebrow">DELETE STUDENT</p><h2 id="student-delete-title">학생 삭제</h2></div><button class="icon-button" type="button" data-close-student-delete aria-label="닫기">×</button></div><div id="student-delete-content"></div></section></div>
<div id="busy" class="busy" hidden><span class="spinner"></span><span>잠시만요…</span></div><div id="toast" role="status"></div>
</body>
</html>
