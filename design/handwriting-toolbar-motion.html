<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Handwriting row move</title>
<style>
  html, body { margin: 0; width: 1180px; height: 820px; overflow: hidden; background: #f0f0f3; }
  #plate { position: fixed; inset: 0; width: 1180px; height: 820px; object-fit: fill; }
  .glass {
    position: fixed; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.72);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.95), inset 0 1px 1px rgba(255,255,255,.9),
      inset 0 -1px 1.5px rgba(255,255,255,.55), 0 0 0 .5px rgba(0,0,0,.07), 0 2px 10px rgba(0,0,0,.08);
    backdrop-filter: blur(18px) saturate(1.55);
    -webkit-backdrop-filter: blur(18px) saturate(1.55);
    color: rgba(60,60,67,.6);
    transform-origin: center center;
  }
  svg { display: block; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .tool svg, .hint svg, .page svg { width: 23px; height: 23px; stroke-width: 2.6px; }
  .back svg { width: 26px; height: 26px; stroke-width: 3.6px; }
  .page svg circle { fill: currentColor; stroke: none; }
  #nav, #aa, #tools, #lobe { z-index: 3; overflow: hidden; }
  #lobe { z-index: 2; border-radius: 50%; pointer-events: none; }
  #tools { z-index: 4; border-radius: 22px; }
  #nav { border-radius: 22px; }
  #nav .back, #nav .page { width: 44px; height: 44px; display: grid; place-items: center; flex: none; }
  #aa { border-radius: 50%; font: 600 17px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; letter-spacing: -.2px; }
  .icons { display: flex; align-items: center; gap: 4px; height: 44px; padding-left: 9px; }
  .tool { width: 44px; height: 44px; display: grid; place-items: center; flex: none; }
  .tool.on { color: #267FA8; }
  .tool.dim { opacity: .64; }
  .book { margin-left: auto; margin-right: 9px; width: 44px; height: 44px; display: grid; place-items: center; flex: none; }
  .hint { position: absolute; inset: 0; display: grid; place-items: center; color: #267FA8; opacity: 0; }
  .hint svg { width: 20px; height: 20px; }
  .outline {
    position: fixed; z-index: 1; box-sizing: border-box; pointer-events: none;
    border: 1.5px dashed rgba(38, 127, 168, .55);
    background: rgba(38, 127, 168, .05);
    opacity: 0;
  }
</style>
</head>
<body>
<img id="plate" alt="">
<div class="outline" id="out-top"></div>
<div class="outline" id="out-left"></div>
<div class="outline" id="out-right"></div>
<div class="glass" id="lobe"></div>
<div class="glass" id="nav">
  <span class="back"></span><span class="page"></span>
</div>
<div class="glass" id="tools">
  <div class="icons"></div>
  <span class="book"></span>
  <span class="hint"></span>
</div>
<div class="glass" id="aa">Aa</div>
<script>
const svg = (body, box = '0 0 24 24') => `<svg viewBox="${box}" aria-hidden="true">${body}</svg>`;
const path = d => svg(`<path d="${d}"/>`);
document.querySelector('#nav .back').innerHTML = path('M14.5 4.5 7.5 12l7 7.5');
document.querySelector('#nav .page').innerHTML = svg('<rect x="3" y="3.5" width="18" height="17" rx="2"/><path d="M9 3.5v17"/><circle cx="6" cy="8" r=".7"/><circle cx="6" cy="12" r=".7"/><circle cx="6" cy="16" r=".7"/>');
const tools = [
  ['M15.15 3.9 20.05 8.8M13.85 5.2 8.35 10.7 5.55 16.75 7.25 18.45 13.3 15.55 18.8 10.05M9.7 12.05l2.45 2.45M6.35 17.55 4.25 19.65', 'on'],
  ['m9 14 7-10 5 4-8 9-4-3Zm0 0-4 5 4 1 4-3M3 22h13', ''],
  ['M7.2 20.4 3.8 17a2 2 0 0 1 0-2.8l9.8-9.8a2 2 0 0 1 2.8 0l3.8 3.8a2 2 0 0 1 0 2.8l-9.4 9.4H7.2ZM8.7 10.7l6.1 6.1M7.2 20.4H21', ''],
  ['M9 5 4 10l5 5M4 10h9a6 6 0 0 1 0 12', 'dim'],
  ['m15 5 5 5-5 5m5-5h-9a6 6 0 0 0 0 12', 'dim'],
];
const icons = document.querySelector('#tools .icons');
for (const [d, kind] of tools) {
  const node = document.createElement('span');
  node.className = 'tool ' + kind;
  node.innerHTML = path(d);
  icons.append(node);
}
document.querySelector('#tools .book').innerHTML = path('M10.7 7.3 5.6 6.1A1.35 1.35 0 0 0 4.3 7.4v9.2a1.35 1.35 0 0 0 1.3 1.3l5.1-1.2M13.3 7.3l5.1-1.2a1.35 1.35 0 0 1 1.3 1.3v9.2a1.35 1.35 0 0 1-1.3 1.3l-5.1-1.2M12 5.1v13.8');
document.querySelector('#tools .hint').innerHTML = path(tools[0][0]);

const ROW_Y = 768, TOP_Y = 12, H = 44;
const NAV = {x: 334, w: 88}, TOOLS = {x: 430, w: 364}, AA = {x: 802, w: 44};
const ROW_CX = 590, ROW_CY = 790, TOP_CY = 34;
const HOLD = 0.36, PRESS = 0.74, MERGE = 1.72, DRAG = 3.48, UNFOLD = 3.48, END = 5.4;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clamp01 = v => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp01(t); return t * t * (3 - 2 * t); };
const smoother = t => { t = clamp01(t); return t * t * t * (t * (t * 6 - 15) + 10); };

function springAxis(pos, vel, target, dt, freq, zeta) {
  const omega = freq * Math.PI * 2;
  const a = omega * omega * (target - pos) - 2 * zeta * omega * vel;
  vel = vel + a * dt;
  pos = pos + vel * dt;
  return [pos, vel];
}

const puck = {x: ROW_CX, y: ROW_CY, vx: 0, vy: 0};
const lobe = {x: ROW_CX, y: ROW_CY, vx: 0, vy: 0};
const spread = {x: 0, v: 0};
let dragged = false;

function integrate(t, dt) {
  let targetX = ROW_CX, targetY = ROW_CY;
  if (t >= MERGE && t < UNFOLD) {
    const local = t - MERGE;
    const arrive = (DRAG - MERGE) * 0.7;
    const dragT = smoother(clamp01(local / arrive));
    targetX = ROW_CX + Math.sin(dragT * Math.PI) * 42;
    targetY = lerp(ROW_CY, TOP_CY, dragT);
    if (!dragged) {
      puck.x = ROW_CX; puck.y = ROW_CY; puck.vx = puck.vy = 0;
      lobe.x = ROW_CX; lobe.y = ROW_CY + 8; lobe.vx = lobe.vy = 0;
      dragged = true;
    }
    [puck.x, puck.vx] = springAxis(puck.x, puck.vx, targetX, dt, 2.5, 0.66);
    [puck.y, puck.vy] = springAxis(puck.y, puck.vy, targetY, dt, 2.5, 0.66);
    [lobe.x, lobe.vx] = springAxis(lobe.x, lobe.vx, puck.x, dt, 1.65, 0.8);
    [lobe.y, lobe.vy] = springAxis(lobe.y, lobe.vy, puck.y, dt, 1.65, 0.8);
  }
  if (t >= UNFOLD) [spread.x, spread.v] = springAxis(spread.x, spread.v, 1, dt, 1.7, 0.58);
}

const frames = [];
const dt = 1 / 60;
for (let t = 0; t <= END + dt; t += dt) {
  integrate(t, dt);
  frames.push({
    t,
    puck: {x: puck.x, y: puck.y, vx: puck.vx, vy: puck.vy},
    lobe: {x: lobe.x, y: lobe.y, vx: lobe.vx, vy: lobe.vy},
    spread: spread.x,
  });
}

function sample(t) {
  const i = clamp(Math.round(t / dt), 0, frames.length - 1);
  return frames[i];
}

const navEl = document.getElementById('nav');
const toolsEl = document.getElementById('tools');
const aaEl = document.getElementById('aa');
const lobeEl = document.getElementById('lobe');
const iconsEl = document.querySelector('#tools .icons');
const bookEl = document.querySelector('#tools .book');
const hintEl = document.querySelector('#tools .hint');
const outlines = {
  top: document.getElementById('out-top'),
  left: document.getElementById('out-left'),
  right: document.getElementById('out-right'),
};
Object.assign(outlines.top.style, {left: '334px', top: '12px', width: '512px', height: '44px', borderRadius: '22px'});
Object.assign(outlines.left.style, {left: '16px', top: '194px', width: '44px', height: '432px', borderRadius: '22px'});
Object.assign(outlines.right.style, {left: '1120px', top: '194px', width: '44px', height: '432px', borderRadius: '22px'});

function place(el, x, y, w, h, opts = {}) {
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  el.style.opacity = opts.opacity == null ? 1 : opts.opacity;
  el.style.borderRadius = (opts.radius == null ? 22 : opts.radius) + 'px';
  const sx = opts.sx == null ? 1 : opts.sx;
  const sy = opts.sy == null ? 1 : opts.sy;
  const rot = opts.rot || 0;
  el.style.transform = (sx === 1 && sy === 1 && !rot) ? 'none' : `rotate(${rot}deg) scale(${sx}, ${sy})`;
  el.style.boxShadow = opts.shadow || '';
}

function render(t) {
  const frame = sample(t);
  const lift = ' , 0 16px 28px rgba(30,64,76,.20)';
  let nav, tools, aa, lobeBox, outlineOpacity = 0;

  if (t < PRESS) {
    const p = t < HOLD ? 0 : smooth((t - HOLD) / (PRESS - HOLD));
    const s = 1 - 0.045 * p;
    const pull = 10 * p;
    nav = {x: NAV.x + pull, y: ROW_Y, w: NAV.w, h: H, sx: s, sy: s, opacity: 1};
    aa = {x: AA.x - pull, y: ROW_Y, w: AA.w, h: H, sx: s, sy: s, opacity: 1, radius: 22};
    tools = {x: TOOLS.x, y: ROW_Y, w: TOOLS.w, h: H, sx: s, sy: s, opacity: 1, icon: 1, hint: 0, radius: 22};
    lobeBox = {opacity: 0};
  } else if (t < MERGE) {
    const m = smoother((t - PRESS) / (MERGE - PRESS));
    const squash = Math.sin(clamp01(m) * Math.PI);
    const navCx = lerp(NAV.x + NAV.w / 2, ROW_CX, m);
    const aaCx = lerp(AA.x + AA.w / 2, ROW_CX, m);
    const toolW = lerp(TOOLS.w, 44, m);
    const toolCx = lerp(TOOLS.x + TOOLS.w / 2, ROW_CX, m);
    nav = {x: navCx - NAV.w / 2, y: ROW_Y, w: NAV.w, h: H, sx: 1 - 0.55 * m, sy: 1 - 0.22 * squash, opacity: 1 - smooth((m - 0.62) / 0.38)};
    aa = {x: aaCx - AA.w / 2, y: ROW_Y, w: AA.w, h: H, sx: 1 - 0.5 * m, sy: 1 - 0.22 * squash, opacity: 1 - smooth((m - 0.62) / 0.38), radius: 22};
    tools = {
      x: toolCx - toolW / 2, y: ROW_Y + (H - H) / 2, w: toolW, h: H,
      sx: 1 - 0.08 * squash, sy: 1 - 0.14 * squash, opacity: 1,
      icon: 1 - smooth((m - 0.28) / 0.5), hint: smooth((m - 0.4) / 0.45),
      radius: lerp(22, 22, m), shadow: m > 0.7 ? lift : '',
    };
    lobeBox = {opacity: 0};
  } else if (t < UNFOLD) {
    const speed = Math.hypot(frame.puck.vx, frame.puck.vy);
    const mag = Math.min(0.34, speed / 1280);
    const rot = Math.atan2(frame.puck.vy, frame.puck.vx) * 180 / Math.PI + 90;
    const fade = smooth(clamp01((t - MERGE) / 0.28));
    outlineOpacity = fade;
    nav = {opacity: 0, x: 0, y: 0, w: NAV.w, h: H, sx: 1, sy: 1};
    aa = {opacity: 0, x: 0, y: 0, w: 44, h: 44, sx: 1, sy: 1, radius: 22};
    tools = {
      x: frame.puck.x - 22, y: frame.puck.y - 22, w: 44, h: 44,
      sx: 1 - mag * 0.72, sy: 1 + mag, rot, opacity: 1, icon: 0, hint: 1, radius: 22,
      shadow: lift,
    };
    const lmag = Math.min(0.4, Math.hypot(frame.lobe.vx, frame.lobe.vy) / 1100);
    const lrot = Math.atan2(frame.puck.vy, frame.puck.vx) * 180 / Math.PI + 90;
    lobeBox = {
      x: frame.lobe.x - 16, y: frame.lobe.y - 16, w: 32, h: 32,
      sx: 0.9 - lmag * 0.3, sy: 1.25 + lmag, rot: lrot, opacity: 0.8 * fade,
    };
  } else {
    const u = frame.spread;
    const shown = clamp(u, 0, 1.12);
    const navCx = lerp(ROW_CX, NAV.x + NAV.w / 2, shown);
    const aaCx = lerp(ROW_CX, AA.x + AA.w / 2, shown);
    const toolW = lerp(44, TOOLS.w, clamp(u, 0, 1.06));
    const toolCx = lerp(ROW_CX, TOOLS.x + TOOLS.w / 2, clamp(u, 0, 1));
    const pop = 1 + Math.max(0, u - 1) * 0.35;
    nav = {x: navCx - NAV.w / 2, y: TOP_Y, w: NAV.w, h: H, sx: lerp(0.28, 1, clamp01(u)) * pop, sy: lerp(0.4, 1, clamp01(u)), opacity: smooth(clamp01(u / 0.28))};
    aa = {x: aaCx - 22, y: TOP_Y, w: 44, h: 44, sx: lerp(0.3, 1, clamp01(u)) * pop, sy: lerp(0.45, 1, clamp01(u)), opacity: smooth(clamp01(u / 0.28)), radius: 22};
    tools = {
      x: toolCx - toolW / 2, y: TOP_Y, w: toolW, h: H,
      sx: 1, sy: lerp(1.08, 1, clamp01(u)), opacity: 1,
      icon: smooth(clamp01((u - 0.18) / 0.4)), hint: 1 - smooth(clamp01(u / 0.32)),
      radius: 22, shadow: u < 0.85 ? lift : '',
    };
    lobeBox = {opacity: 0};
    outlineOpacity = 1 - smooth(clamp01((t - UNFOLD) / 0.22));
  }

  place(navEl, nav.x, nav.y, nav.w, nav.h, nav);
  place(aaEl, aa.x, aa.y, aa.w, aa.h, aa);
  place(toolsEl, tools.x, tools.y, tools.w, tools.h, tools);
  iconsEl.style.opacity = tools.icon == null ? 1 : tools.icon;
  bookEl.style.opacity = tools.icon == null ? 1 : tools.icon;
  hintEl.style.opacity = tools.hint || 0;
  if (lobeBox.opacity) place(lobeEl, lobeBox.x, lobeBox.y, lobeBox.w, lobeBox.h, lobeBox);
  else lobeEl.style.opacity = 0;
  for (const node of Object.values(outlines)) node.style.opacity = outlineOpacity;
}

let t0 = 0;
function tick(now) {
  if (!t0) t0 = now;
  const t = (now - t0) / 1000;
  render(Math.min(t, END));
  if (t >= END) { window.__done = true; return; }
  requestAnimationFrame(tick);
}
window.__ready = false;
window.go = () => requestAnimationFrame(tick);

const plate = document.getElementById('plate');
plate.src = 'plate.png';
plate.onload = () => { render(0); window.__ready = true; };
</script>
</body>
</html>
