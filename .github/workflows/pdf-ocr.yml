name: Scanned PDF OCR
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  browser:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Verify offline local Blob and FileReader before application regressions
        run: node tests/verify-offline-blob-engine.mjs
        env:
          BROWSER: ${{ matrix.engine }}
      - run: node tests/verify-pdf-ocr-library-browser.mjs
        env:
          BROWSER: ${{ matrix.engine }}
      - run: npm run test:pdf-ocr
        env:
          BROWSER: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-browser-stress-${{ matrix.engine }}
          path: |
            /tmp/breeze-offline-blob-control/
            /tmp/breeze-ocr-browser-stress/
            /tmp/breeze-ocr-confirm/
            /tmp/breeze-ocr-library/
          if-no-files-found: warn
          retention-days: 7

  suite-status:
    needs: [changes, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
