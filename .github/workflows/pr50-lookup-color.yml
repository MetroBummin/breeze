name: PR50 lookup color validation
on:
  push:
    branches: [chatgpt/lookup-no-redundant-work-20260929]
jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/verify-reader-feedback-browser.mjs
