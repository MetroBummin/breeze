name: PDF pointer ink
on:
  pull_request:
    paths:
      - 'scripts/reader/**'
      - 'scripts/library/ink-sync.js'
      - 'server/sync/book-ink.sql'
      - 'styles/reader.css'
      - 'tests/verify-pdf*'
      - 'tests/verify-ink-sync*'
      - 'tests/verify-device-polish-browser.mjs'
      - 'tests/helpers/pdf-geometry-fixture.mjs'
      - '.github/workflows/pdf-pointer-ink.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-pointer-ink-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: node --test tests/verify-pdf-ink-regressions.mjs
      - run: node tests/verify-pdf-pointer-ink-browser.mjs
      - run: node tests/verify-pdf-availability-browser.mjs
      - run: node tests/verify-device-polish-browser.mjs
      - run: node tests/verify-pdf-ink-browser.mjs
        env:
          BREEZE_QA_OUTPUT: /tmp/breeze-pdf-palette
      - name: Worker and durable fallback in Chromium and WebKit
        run: |
          for engine in chromium webkit; do
            BREEZE_QA_ENGINE=$engine node tests/verify-pdf-ink-store-browser.mjs
          done
      - name: Pending and failed saves across close/reopen/background
        run: node tests/verify-pdf-ink-save-lifecycle-browser.mjs
      - name: Ink sync debounce, merge apply, and storage fallback
        run: |
          for engine in chromium webkit firefox; do
            BREEZE_QA_ENGINE=$engine node tests/verify-ink-sync-browser.mjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-pointer-ink-proof
          path: |
            /tmp/breeze-pdf-pointer-ink/
            /tmp/breeze-pdf-availability/
            /tmp/breeze-pdf-palette/
          if-no-files-found: ignore
          retention-days: 7
