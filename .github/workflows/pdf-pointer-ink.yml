name: PDF pointer ink
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
concurrency:
  group: pdf-pointer-ink-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  chromium:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit firefox
      - run: node --test tests/verify-pdf-ink-regressions.mjs
      - run: node tests/verify-pdf-pointer-ink-browser.mjs
      - run: node tests/verify-pdf-availability-browser.mjs
      - run: node tests/verify-device-polish-browser.mjs
      - run: node tests/verify-pdf-ink-browser.mjs
        env:
          BREEZE_QA_OUTPUT: /tmp/breeze-pdf-palette
      - name: Worker and durable fallback in Chromium and WebKit
        run: |
          for engine in chromium webkit; do
            BREEZE_QA_ENGINE=$engine node tests/verify-pdf-ink-store-browser.mjs
          done
      - name: Pending and failed saves across close/reopen/background
        run: node tests/verify-pdf-ink-save-lifecycle-browser.mjs
      - name: Ink sync debounce, merge apply, and storage fallback
        run: |
          for engine in chromium webkit firefox; do
            BREEZE_QA_ENGINE=$engine node tests/verify-ink-sync-browser.mjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-pointer-ink-proof
          path: |
            /tmp/breeze-pdf-pointer-ink/
            /tmp/breeze-pdf-availability/
            /tmp/breeze-pdf-palette/
          if-no-files-found: ignore
          retention-days: 7

  suite-status:
    needs: [changes, chromium]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
