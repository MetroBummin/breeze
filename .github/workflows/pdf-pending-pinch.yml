name: PDF pending lookup pinch
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
concurrency:
  group: pdf-pending-pinch-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  regression:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Pending word and sentence pinch ownership and stale replies
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BROWSER: ${{ matrix.engine }}
          BREEZE_QA_OUTPUT: /tmp/breeze-pending-pinch-proof
        run: node tests/verify-pdf-pending-pinch-browser.mjs && node tests/verify-sentence-help-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-pending-pinch-${{ matrix.engine }}
          path: /tmp/breeze-pending-pinch-proof/
          if-no-files-found: error
          retention-days: 7

  suite-status:
    needs: [changes, regression]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
