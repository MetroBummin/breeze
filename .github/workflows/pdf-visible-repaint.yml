name: PDF visible-page repaint regression
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
concurrency:
  group: pdf-visible-repaint-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  regression:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        orientation: [portrait, landscape]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Compare baseline, translation, ready and pending explanation
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BREEZE_QA_ORIENTATION: ${{ matrix.orientation }}
          BREEZE_PDF_REPAINT_PROOF: /tmp/breeze-pdf-visible-repaint
        run: timeout --kill-after=5s 600s node tests/verify-pdf-visible-repaint-browser.mjs
      - name: Canvas lifecycle, cleanup and screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-visible-repaint-${{ matrix.engine }}-${{ matrix.orientation }}
          path: /tmp/breeze-pdf-visible-repaint/
          if-no-files-found: error
          retention-days: 7

  suite-status:
    needs: [changes, regression]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
