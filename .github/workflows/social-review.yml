name: Verify nested social post scope
on:
  push:
    branches: [chatgpt/social-import-hardening-20260925]
permissions:
  contents: write
jobs:
  check:
    if: github.event.head_commit.message == 'final-social-scope-check' && github.repository == 'MetroBummin/breeze'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Scope identity and body to the same post owner
        shell: python
        run: |
          import pathlib, hashlib, subprocess, os
          p=pathlib.Path('scripts/importers/social.js');s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='cf9c820722eb54ec500bd0cd793a8ec4a82df16d35d6dd22d03a9e57b54e6d99'
          s=s.replace("      const permalink=post.querySelector('time')?.closest('a')?.getAttribute('href');", "      const time=[...post.querySelectorAll('time')].find(n=>n.closest('article,[data-testid=\"tweet\"]')===post);\n      const permalink=time?.closest('a')?.getAttribute('href');")
          s=s.replace("      const body=post.querySelector('[data-testid=\"tweetText\"],[itemprop=\"articleBody\"]');", "      const body=[...post.querySelectorAll('[data-testid=\"tweetText\"],[itemprop=\"articleBody\"]')].find(n=>n.closest('article,[data-testid=\"tweet\"]')===post);")
          s=s.replace("date:post.querySelector('time')?.getAttribute('datetime')", "date:time?.getAttribute('datetime')")
          p.write_text(s)
          test=pathlib.Path('tests/verify-social-import-browser.mjs');s=test.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='feb3ece58fe4c2ad5208bbe79aa2304e7a62dcc49beb174cb9f6c210bde9a98d'
          marker="  await check('80 concurrent alias imports: one fetch, one persisted book, latest opens',async()=>{"
          addition="""  await check('nested quoted permalink cannot misattribute outer body',async()=>{
           const html=`<article><div data-testid="tweetText">Not the requested author's post.</div><article><a href="${post}"><time datetime="2026-09-24">date</time></a><div data-testid="tweetText">Requested post only.</div></article></article>`;
           const r=await parse(html,post);assert.equal(r.parsed.blocks[0].t,'Requested post only.');assert(!JSON.stringify(r).includes('Not the requested'));
          });
          """
          assert marker in s;s=s.replace(marker,addition+marker);test.write_text(s)
          subprocess.run(['node','tools/stamp-version.mjs'],check=True)
          subprocess.run(['node','tools/typecheck.mjs'],check=True)
          subprocess.run(['git','add','scripts/importers/social.js','tests/verify-social-import-browser.mjs','index.html','sw.js'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: bind social permalink and body to the same post owner'],check=True)
          branch='chatgpt/social-import-hardening-20260925'
          current=subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          assert current==os.environ['GITHUB_SHA']
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          print('PUBLISHED',subprocess.check_output(['git','rev-parse','HEAD'],text=True))
      - run: node --test tests/verify-social-import-server.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/verify-social-import-browser.mjs
      - run: npm run test:ingestion
      - run: npm test
