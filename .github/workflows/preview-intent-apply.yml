name: Verify Preview correction
on:
  push:
    branches: [chatgpt/preview-intent-fix-20260925]
permissions:
  contents: write
jobs:
  correct:
    if: github.event.head_commit.message == 'stage-preview-intent-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --experimental-strip-types
      BREEZE_PREVIEW_CAPTURE_DIR: /tmp/preview-capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply hash-verified isolated edits
        shell: python
        run: |
          import pathlib,base64,gzip,hashlib,json
          root=pathlib.Path.cwd()
          payload=base64.b64decode(''.join((root/'.preview-stage'/str(i)).read_text() for i in range(4)),validate=True)
          assert hashlib.sha256(payload).hexdigest()=='e5e0e1ba1d0b94a1aacf7ab31d02a2d80300a3f2609e2db5d018de62be936351'
          rows=json.loads(gzip.decompress(payload))
          for row in rows:
              p=pathlib.PurePosixPath(row['path'])
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in ('scripts','styles','tests','docs','index.html','sw.js')
              dest=root/p
              old=dest.read_bytes().decode() if dest.exists() else ''
              if row['old'] is None: assert not dest.exists(), str(p)
              else: assert hashlib.sha256(old.encode()).hexdigest()==row['old'], str(p)
              for a,b,text in reversed(row['edits']):
                  assert 0<=a<=b<=len(old)
                  old=old[:a]+text+old[b:]
              assert hashlib.sha256(old.encode()).hexdigest()==row['new'], str(p)
              dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(old.encode())
          pathlib.Path('/tmp/preview-changed.json').write_text(json.dumps([r['path'] for r in rows]))
      - run: node tools/typecheck.mjs && node tools/stamp-version.mjs && git diff --check
      - run: npx playwright install --with-deps chromium webkit
      - name: New save-intent and metadata-state regression
        run: node tests/verify-preview-intent-browser.mjs
      - name: Existing Preview resilience
        run: node tests/verify-article-preview-resilience.mjs
      - name: Existing ingestion and Home regression
        run: npm run test:ingestion && npm run test:home-ui
      - name: Full contracts
        run: npm test && node --test tests/verify-article-preview-server.mjs
      - name: Commit verified code to this branch only
        shell: python
        run: |
          import pathlib,json,os,subprocess
          branch='chatgpt/preview-intent-fix-20260925'
          current=subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          assert current==os.environ['GITHUB_SHA'], 'Branch changed; refusing to overwrite'
          paths=json.loads(pathlib.Path('/tmp/preview-changed.json').read_text())
          for p in pathlib.Path('.preview-stage').iterdir(): p.unlink()
          pathlib.Path('.preview-stage').rmdir()
          subprocess.run(['git','add','--']+paths+['.preview-stage'],check=True)
          subprocess.run(['git','add','-u','--','index.html','sw.js','docs'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: defer discovery saving until Read and show honest Korean preview states'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          print('PUBLISHED',subprocess.check_output(['git','rev-parse','HEAD'],text=True))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-correction-evidence
          path: /tmp/preview-capture
          retention-days: 2
          if-no-files-found: ignore
