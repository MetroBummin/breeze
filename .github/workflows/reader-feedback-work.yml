name: Reader feedback work branch
on:
  push:
    branches: [chatgpt/reader-lookup-shimmer-20260928]
    paths: ['.github/workflows/reader-feedback-work.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'MetroBummin/breeze' && github.ref == 'refs/heads/chatgpt/reader-lookup-shimmer-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium webkit
      - name: PDF writing controls and ink regression
        id: ink
        continue-on-error: true
        env:
          BREEZE_QA_OUTPUT: /tmp/reader-feedback-qa/ink
        run: node tests/verify-pdf-ink-browser.mjs
      - name: Repeat branch PDF geometry regression
        id: geometry
        continue-on-error: true
        env:
          BREEZE_QA_OUTPUT: /tmp/reader-feedback-qa/branch
        run: node tests/verify-pdf-highlight-browser.mjs
      - uses: actions/checkout@v4
        with:
          ref: d88ea83d0d9df513090753a71d3578702ce4fd3b
          path: baseline-source
          persist-credentials: false
      - name: Exact unmodified main PDF geometry comparison
        id: baseline
        continue-on-error: true
        env:
          BREEZE_QA_OUTPUT: /tmp/reader-feedback-qa/baseline
        run: node baseline-source/tests/verify-pdf-highlight-browser.mjs
      - name: Report independent outcomes
        if: always()
        run: |
          echo "Ink: ${{ steps.ink.outcome }}; branch geometry: ${{ steps.geometry.outcome }}; exact base geometry: ${{ steps.baseline.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          test '${{ steps.ink.outcome }}' = success
          test '${{ steps.geometry.outcome }}' = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-feedback-qa
          path: /tmp/reader-feedback-qa
          retention-days: 1
