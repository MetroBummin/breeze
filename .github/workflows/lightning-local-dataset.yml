name: Lightning local dataset experiment
on:
  push:
    branches: [chatgpt/lightning-local-10k-20260928]
    paths:
      - '.github/workflows/lightning-local-dataset.yml'
      - 'tools/build-lightning-lexicon.py'
      - 'scripts/dictionary/local-lexicon.js'
      - 'tests/*local-lexicon*'
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/chatgpt/lightning-local-10k-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Acquire only the pinned public source
        shell: python
        run: |
          import urllib.request, gzip, json, hashlib, pathlib
          meta = json.loads(pathlib.Path('assets/dictionaries/en-ko-10k/source.json').read_text())
          req = urllib.request.Request(meta['source'], headers={'User-Agent':'Breeze-Local-Dictionary-Experiment/1.0'})
          with urllib.request.urlopen(req, timeout=120) as response:
              data = response.read(100_000_001)
          if len(data)>100_000_000 or hashlib.sha256(data).hexdigest()!=meta['sourceGzipSha256']:
              raise RuntimeError('Source changed; review before updating the pinned manifest')
          rows=[]
          for line in gzip.decompress(data).splitlines():
              row=json.loads(line)
              if row.get('lang_code')=='en': rows.append(row)
          path=pathlib.Path('build-input-en.jsonl')
          path.write_text(''.join(json.dumps(r,ensure_ascii=False)+'\n' for r in rows),encoding='utf-8')
          if hashlib.sha256(path.read_bytes()).hexdigest()!=meta['englishJsonlSha256']:
              raise RuntimeError('Canonical English source checksum mismatch')
      - name: Build and verify without AI calls
        shell: bash
        run: |
          mkdir -p test-results
          python3 tools/build-lightning-lexicon.py --input build-input-en.jsonl --manifest assets/dictionaries/en-ko-10k/source.json --corpus-root . | tee test-results/build.json
          python3 tests/verify-local-lexicon-source.py build-input-en.jsonl | tee test-results/provenance.txt
          node --test tests/verify-local-lexicon.mjs | tee test-results/node-tests.txt
          node --expose-gc tests/benchmark-local-lexicon.mjs test-results/benchmark.json
          python3 - <<'PY'
          import json
          m=json.load(open('assets/dictionaries/en-ko-10k/manifest.json'))
          assert m['headwords']==10000 and m['senses']==14120
          assert m['dictionarySha256']=='ba05be3d8643de29bf85c47899118441b7da48df8db0a27b964f72b8dff51c33'
          PY
      - name: Commit generated data only to the experiment branch
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/chatgpt/lightning-local-10k-20260928'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dictionaries/en-ko-10k/dictionary.json assets/dictionaries/en-ko-10k/dictionary.json.gz assets/dictionaries/en-ko-10k/provenance.jsonl.gz assets/dictionaries/en-ko-10k/manifest.json
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'data(lightning): add verified 10,000 headwords and 14,120 source-backed senses'
            git push origin HEAD:refs/heads/chatgpt/lightning-local-10k-20260928
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-local-10k-verified
          path: |
            assets/dictionaries/en-ko-10k/
            test-results/
          retention-days: 14
