name: Preview intent
on:
  push:
    branches: [main, chatgpt/preview-intent-fix-20260925]
  pull_request:
permissions:
  contents: read
  actions: write
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
concurrency:
  group: preview-intent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  verify:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools/typecheck.mjs
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: node tests/verify-preview-intent-browser.mjs
      - run: node tests/verify-article-preview-browser.mjs
      - run: node tests/verify-article-preview-resilience.mjs

  suite-status:
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
