name: PDF input ownership
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  ownership:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Production policy and adapter regression checks
        run: node tests/verify-pdf-input-ownership.mjs
      - name: Real UIKit and WebKit SDK typecheck
        run: node tests/verify-pdf-input-ownership.mjs --ios-typecheck

  suite-status:
    needs: [changes, ownership]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
