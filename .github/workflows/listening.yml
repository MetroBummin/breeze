name: Listening mode
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: listening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node --test tests/verify-listening.mjs
      - name: Listening walk-through (scripted voice)
        env:
          BROWSER: ${{ matrix.engine }}
        run: node tests/capture-listening-browser.mjs /tmp/listening
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listening-${{ matrix.engine }}
          path: /tmp/listening
          if-no-files-found: ignore
