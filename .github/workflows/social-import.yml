name: Social import
on:
  pull_request:
  workflow_dispatch:
    inputs:
      live_media:
        description: 'Check the public X Article and its stored images against live services'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
concurrency:
  group: social-import-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  verify:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: node tools/typecheck.mjs || (npx tsc -p tsconfig.json --pretty false; exit 1)
      - run: node --test tests/verify-social-import-server.mjs tests/verify-social-content.mjs tests/verify-social-inline.mjs
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: node tests/verify-social-import-browser.mjs
      - run: npm run test:ingestion
      - run: npm test
  live-media:
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.live_media) || (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[verify-live-social-media]')))
    # Public network availability is checked explicitly, not on every fixture run.
    # Opt in from the PR body with [verify-live-social-media], or the manual input.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: node tests/verify-live-social-media-browser.mjs

  suite-status:
    needs: [changes, verify, live-media]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
