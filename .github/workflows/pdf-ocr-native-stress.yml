name: Native OCR stress
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
concurrency:
  group: native-ocr-stress-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  vision:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Execute production plugin with actual Apple Vision, network denied
        run: bash tests/native/run-pdf-ocr-vision.sh
        env:
          BREEZE_OCR_REPEAT_COUNT: '384'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-vision-stress
          path: ${{ runner.temp }}/breeze-ocr-vision/
          if-no-files-found: warn
          retention-days: 7
  mlkit:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    # Gradle, the API 35 image, the 480s boot deadline, and the 720s
    # instrumentation deadline all sit inside this job. The harness still
    # fails on its own deadlines; this only keeps the runner from canceling
    # a live emulator.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build only debug and test APKs with owned corpus in test assets
        run: |
          npm run android:sync
          mkdir -p android/app/src/androidTest/assets/pdf-ocr-stress
          cp tests/fixtures/pdf-ocr-stress/* android/app/src/androidTest/assets/pdf-ocr-stress/
          cd android
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Bounded emulator boot and offline production ML Kit execution
        run: bash tests/native/run-pdf-ocr-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-mlkit-stress
          path: ${{ runner.temp }}/breeze-ocr-android/
          if-no-files-found: warn
          retention-days: 7

  suite-status:
    needs: [changes, vision, mlkit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
