name: Large All Words and picker scrolling
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
concurrency:
  group: all-words-picker-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  browser:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Measure shipped build271 with the identical workload
        run: node tests/measure-breeze271-baseline.mjs
        env:
          BREEZE_ALL_WORDS_OUTPUT: /tmp/breeze-all-words/before
      - name: Measure the proposed fixes
        run: node tests/measure-all-words-browser.mjs && node tests/measure-study-picker-scroll-browser.mjs
        env:
          BREEZE_ALL_WORDS_OUTPUT: /tmp/breeze-all-words/after
      - name: Window, data, history and scroll-ownership regressions
        run: node tests/verify-all-words-window-browser.mjs && node tests/verify-study-picker-scroll-browser.mjs
        env:
          BREEZE_ALL_WORDS_OUTPUT: /tmp/breeze-all-words/after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-words-picker-${{ matrix.engine }}
          path: /tmp/breeze-all-words/
          retention-days: 14

  suite-status:
    needs: [changes, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
