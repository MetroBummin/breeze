name: Integrity
on:
  pull_request:
  push:
    branches: [chatgpt/audit-hardening-20260925]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Verify integrated native asset sync
        run: |
          npm run ios:sync
          cmp scripts/importers/rss.js www/scripts/importers/rss.js
          cmp scripts/importers/rss.js ios/App/App/public/scripts/importers/rss.js
          cmp index.html www/index.html
          cmp index.html ios/App/App/public/index.html
          git diff --exit-code -- index.html sw.js ios/App/App.xcodeproj/project.pbxproj
      - name: RSS catalog function types and disabled boot
        if: ${{ hashFiles('supabase/functions/rss-catalog/index.ts') != '' }}
        env:
          RSS_CATALOG_MODE: 'off'
        run: |
          npx --yes deno@2.9.6 check --config supabase/functions/rss-catalog/deno.json supabase/functions/rss-catalog/index.ts
          npx --yes deno@2.9.6 test --allow-env=RSS_CATALOG_MODE --config supabase/functions/rss-catalog/deno.json tests/verify-rss-catalog-off-deno.mjs
          RSS_CATALOG_MODE=active RSS_CATALOG_FEED_IDS=0,1 RSS_CATALOG_ORIGINAL_FEED_IDS= SUPABASE_URL=https://catalog-db.fixture SUPABASE_SERVICE_ROLE_KEY=synthetic-service-key SUPABASE_ANON_KEY=synthetic-anon-key npx --yes deno@2.9.6 test --allow-env=RSS_CATALOG_MODE,RSS_CATALOG_FEED_IDS,RSS_CATALOG_ORIGINAL_FEED_IDS,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_ANON_KEY --config supabase/functions/rss-catalog/deno.json tests/verify-rss-catalog-active-deno.mjs
          npx --yes deno@2.9.6 test --allow-net=127.0.0.1 --config supabase/functions/rss-catalog/deno.json tests/verify-rss-catalog-prefix-deno.mjs
          node tests/measure-rss-catalog-server.mjs
      - name: Feature audit contracts
        run: |
          for test in tests/verify-home-design-audit.mjs tests/verify-ink-scope-audit.mjs tests/verify-article-preview-server.mjs tests/verify-pdf-ink-geometry.mjs; do
            if test -f "$test"; then node --test "$test"; fi
          done
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Email login interruption and resend regression
        run: node tests/verify-email-login-browser.mjs
      - name: Email login visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-login-proof
          path: /tmp/breeze-email-login-proof/
          if-no-files-found: ignore
          retention-days: 7
      - name: RSS and current-cover chooser regressions in Chromium and WebKit
        run: |
          status=0
          for engine in chromium webkit; do
            # Bound the owned process group too, including browser-launch/cleanup
            # failures. A timeout remains a failed check; every case still runs.
            BREEZE_QA_ENGINE=$engine BREEZE_COVER_PROOF=/tmp/breeze-cover-chooser/$engine timeout --verbose --kill-after=5s 120s node tests/verify-cover-chooser-browser.mjs || status=1
            BREEZE_QA_ENGINE=$engine BREEZE_RSS_COVER_PROOF=/tmp/breeze-rss-covers/$engine timeout --verbose --kill-after=5s 120s node tests/verify-rss-covers-browser.mjs || status=1
            BREEZE_QA_ENGINE=$engine BREEZE_RSS_VISIBLE_COVER_PROOF=/tmp/breeze-rss-visible-covers/$engine timeout --verbose --kill-after=5s 120s node tests/diagnose-rss-cover-serial.mjs || status=1
            BREEZE_QA_ENGINE=$engine BREEZE_RSS_ENRICHMENT_CURRENT_ONLY=1 BREEZE_RSS_ENRICHMENT_PROOF=/tmp/breeze-rss-enrichment/$engine timeout --verbose --kill-after=5s 120s node tests/compare-rss-cover-enrichment-browser.mjs || status=1
          done
          exit "$status"
      - name: Cover regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-regression-proof
          path: |
            /tmp/breeze-cover-chooser/
            /tmp/breeze-rss-covers/
            /tmp/breeze-rss-enrichment/
            /tmp/breeze-rss-visible-covers/
          if-no-files-found: ignore
          retention-days: 7
      - name: RSS intent boundary and catalog browser contracts
        if: ${{ !cancelled() }}
        run: |
          for engine in chromium webkit; do
            BREEZE_QA_ENGINE=$engine BREEZE_CATALOG_CURRENT_ONLY=1 BREEZE_CATALOG_QUICK=1 BREEZE_CATALOG_PROOF=/tmp/breeze-catalog-browser-proof/$engine node tests/benchmark-rss-catalog-browser.mjs || exit 1
          done
      - name: RSS catalog browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-catalog-browser-proof
          path: /tmp/breeze-catalog-browser-proof/
          if-no-files-found: ignore
          retention-days: 7
      - name: Bohemia progress and Home reading cards in Chromium and WebKit
        run: |
          status=0
          for engine in chromium webkit; do
            BREEZE_QA_ENGINE=$engine npm run test:bohemia-progress || status=1
            BREEZE_QA_ENGINE=$engine npm run test:home-reading-cards || status=1
            BREEZE_QA_ENGINE=$engine npm run test:recent-reading || status=1
            BREEZE_QA_ENGINE=$engine npm run test:pdf-sidebar || status=1
          done
          exit "$status"
      - name: Home reading card proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-reading-cards-proof
          path: |
            /tmp/breeze-home-reading-cards-proof/
            /tmp/breeze-recent-proof/
            /tmp/breeze-pdf-sidebar-motion/
            /tmp/breeze-sidebar-body-gestures/
          if-no-files-found: ignore
          retention-days: 7
      - name: Bundled long-read previews, imports and offline persistence
        run: npm run test:longreads && npm run test:homeward-lookup
      - name: Five illustrated Holmes stories in Chromium and WebKit
        run: npm run test:holmes
      - name: Holmes artwork and typography proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holmes-illustrated-proof
          path: /tmp/breeze-holmes-integration-proof/
          if-no-files-found: ignore
          retention-days: 7
      - name: Long-read preview proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longread-preview-proof
          path: /tmp/breeze-holmes-proof/
          if-no-files-found: ignore
          retention-days: 7
      - name: Reader gestures, pinch dismissal and covers in Chromium and WebKit
        run: node tests/verify-reader-input-gestures-browser.mjs && node tests/verify-word-pinch-browser.mjs && node tests/verify-client-polish-browser.mjs
      - name: Reader input gesture proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-input-gestures-proof
          path: /tmp/breeze-input-gestures/
          if-no-files-found: ignore
          retention-days: 7
      - name: RSS shadow and approval regressions
        run: node tests/verify-rss-quality-browser.mjs
      - name: Vocabulary review in Chromium and WebKit
        run: |
          status=0
          node tests/verify-vocabulary-review-browser.mjs || status=1
          BROWSER=webkit node tests/verify-vocabulary-review-browser.mjs || status=1
          node tests/verify-simple-word-cards-browser.mjs || status=1
          BROWSER=webkit node tests/verify-simple-word-cards-browser.mjs || status=1
          exit "$status"
      - name: Vocabulary review visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-review-proof
          path: |
            /tmp/breeze-review-proof/
            /tmp/breeze-simple-word-cards-proof/
          if-no-files-found: ignore
          retention-days: 7
      - name: Real IndexedDB and navigation regression
        run: if test -f tests/verify-integrity-browser.mjs; then node tests/verify-integrity-browser.mjs; fi
      - run: npm run test:ingestion && npm run test:home-ui
      - name: Preview regressions when present
        run: |
          for test in tests/verify-article-preview-browser.mjs tests/verify-article-preview-resilience.mjs tests/verify-device-polish-browser.mjs; do
            if test -f "$test"; then node "$test"; fi
          done
      - name: Ink regression when present
        run: if test -f tests/verify-pdf-ink-browser.mjs; then node tests/verify-pdf-ink-browser.mjs; fi
      - name: Reader page morph and rotation regressions
        run: node tests/verify-breeze16-browser.mjs
      - name: Reader chrome motion and interruption regressions
        run: node tests/verify-reader-chrome-motion-browser.mjs
      - name: Reader work, selection and original round-trip regressions
        run: node tests/verify-reader-work-browser.mjs
      - name: Horizontal progress and long EPUB preview regressions
        run: node tests/verify-reader-211-browser.mjs
      - name: Onboarding and independent shelf categories
        run: node tests/verify-onboarding-browser.mjs && BROWSER=webkit node tests/verify-onboarding-browser.mjs && node tests/verify-category-import-browser.mjs
      - name: Reader notice hit targets and EPUB navigation input
        run: node tests/verify-reader-notice-controls-browser.mjs && node tests/verify-epub-navigation-input-browser.mjs
      - name: On-demand easy explanation in Chromium and WebKit
        run: node tests/verify-easy-explanation-browser.mjs && BROWSER=webkit node tests/verify-easy-explanation-browser.mjs
      - name: Sentence help and lookup lifecycle in Chromium and WebKit
        run: |
          for engine in chromium webkit; do
            BROWSER=$engine node tests/verify-sentence-help-browser.mjs
            BROWSER=$engine node tests/verify-sentence-presentation-browser.mjs
            BREEZE_QA_ENGINE=$engine node tests/verify-sentence-cue-browser.mjs
          done
      - name: Sentence help visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentence-help-proof
          path: /tmp/breeze-sentence-help-proof/
          if-no-files-found: ignore
          retention-days: 7
      - name: Saved original position during interrupted reopening
        run: node tests/verify-original-reopen-browser.mjs
  import-byte-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: current
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: current
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 7f64075aa1a4b82c74ec7bb829409b99d09e6d81
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: current/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Compare unchanged assertions and byte boundaries on base and current
        run: BREEZE_BYTE_BASE_ROOT="$GITHUB_WORKSPACE/base" node tests/diagnose-import-bytes.mjs
      - name: Import byte diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-byte-diagnostic
          path: /tmp/breeze-import-byte-matrix/
          if-no-files-found: error
          retention-days: 7
  catalog-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Explicit hybrid RSS transport and selected-intent browser contracts
        run: |
          status=0
          for engine in chromium webkit; do
            BREEZE_QA_ENGINE=$engine BREEZE_HYBRID_PROOF=/tmp/breeze-catalog-browser-proof/$engine/hybrid timeout --verbose --kill-after=5s 120s node tests/verify-rss-catalog-hybrid-browser.mjs || status=1
          done
          exit "$status"
      - name: Hybrid RSS browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-catalog-hybrid-proof
          path: /tmp/breeze-catalog-browser-proof/
          if-no-files-found: error
          retention-days: 7
  reader-chrome-layout-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Prove no-op invalidation before and after the production guard
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BREEZE_SCOPE_PROOF: /tmp/breeze-chrome-layout/causal
        run: timeout --kill-after=5s 120s node tests/diagnose-pdf-scope-noop-browser.mjs
      - name: Trace paper cache invalidation without changing the zero-read assertion
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BREEZE_CHROME_TRACE_ITERATIONS: '3'
          BREEZE_CHROME_TRACE_PROOF: /tmp/breeze-chrome-layout
        run: timeout --kill-after=5s 600s node tests/diagnose-reader-chrome-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-chrome-layout-${{ matrix.engine }}
          path: /tmp/breeze-chrome-layout/
          if-no-files-found: error
          retention-days: 7
  meaning-unit-experiment:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'experiment/ai-meaning-unit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Deterministic meaning-unit safety and baseline evidence
        run: |
          node experiments/meaning-unit/stress.mjs
          node experiments/meaning-unit/original-adapter-test.mjs
      - name: Same synthetic rendering matrix in Chromium and WebKit
        env:
          REQUIRE_ALL_ENGINES: '1'
        run: |
          timeout --kill-after=5s 180s node experiments/meaning-unit/browser.mjs
          timeout --kill-after=5s 180s node experiments/meaning-unit/original-browser.mjs
      - name: Meaning-unit experiment evidence (zero model calls)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meaning-unit-experiment-proof
          path: experiments/meaning-unit/artifacts/
          if-no-files-found: error
          retention-days: 7
