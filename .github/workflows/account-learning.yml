name: Account learning isolation
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'server/sync/**'
      - 'package.json'
      - '.github/workflows/account-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:account
      - run: npm run test:sync
      - run: npm run typecheck
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:account:browser
        env:
          BROWSER: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-learning-proof-${{ matrix.engine }}
          path: /tmp/breeze-account-scope-proof
          if-no-files-found: ignore
          retention-days: 7
  web-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            mobile: ''
          - engine: firefox
            mobile: ''
          - engine: webkit
            mobile: ''
          - engine: webkit
            mobile: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node tests/verify-storage-migration-web.mjs
        env:
          BROWSER: ${{ matrix.engine }}
          MOBILE: ${{ matrix.mobile }}
