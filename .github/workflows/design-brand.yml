name: Design-only brand
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
concurrency:
  group: design-brand-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  browser:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      # The original design release pinned auth to its pre-auth baseline.
      # An explicit auth-only extraction retains all its non-auth boundaries.
      - run: |
          if test -f tests/verify-next-release-boundary.mjs; then
            node tests/verify-next-release-boundary.mjs
          elif test -f tests/verify-social-auth-boundary.mjs; then
            node tests/verify-social-auth-boundary.mjs
          else
            node tests/verify-design-only-boundary.mjs
          fi
      - name: Ensure python3 for brand icon checks
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y python3
            else
              apt-get update && apt-get install -y python3
            fi
          fi
      - run: npm run test:brand-icons
      - run: node tests/verify-design-home-browser.mjs
      - run: node tests/verify-design-memory-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-brand-${{ matrix.browser }}
          path: |
            /tmp/breeze-design-only-final*/
            /tmp/breeze-memory-proof/
          if-no-files-found: ignore
          retention-days: 7
  ios-compile:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The original design release pinned auth to its pre-auth baseline.
      # An explicit auth-only extraction retains all its non-auth boundaries.
      - run: |
          if test -f tests/verify-next-release-boundary.mjs; then
            node tests/verify-next-release-boundary.mjs
          elif test -f tests/verify-social-auth-boundary.mjs; then
            node tests/verify-social-auth-boundary.mjs
          else
            node tests/verify-design-only-boundary.mjs
          fi
      - run: npm run ios:sync
      - name: Compile without signing or upload
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/breeze-design-ios
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  suite-status:
    needs: [changes, browser, ios-compile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
