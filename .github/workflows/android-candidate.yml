name: Android 1.9.2 unsigned candidate
on:
  push:
    branches: [release/android-192-code2-20261010]
permissions:
  contents: read
concurrency:
  group: android-192-code2-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the preinstalled SDK without accepting new licenses
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:android
      - name: Sync the exact base web source
        run: |
          npm run android:sync
          cmp index.html android/app/src/main/assets/public/index.html
          git diff --exit-code -- index.html sw.js
      - name: Release unit tests, release lint and unsigned AAB; no debug packaging or keys
        working-directory: android
        run: ./gradlew --no-daemon -PandroidVersionCode=2 :app:testReleaseUnitTest :app:lintRelease :app:bundleRelease
      - name: Validate the actual bundle with Google's pinned bundletool
        run: |
          mkdir -p /tmp/breeze-android-candidate
          curl --fail --location --silent --show-error https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output /tmp/breeze-android-candidate/bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  /tmp/breeze-android-candidate/bundletool.jar' | sha256sum --check
          java -jar /tmp/breeze-android-candidate/bundletool.jar validate --bundle=android/app/build/outputs/bundle/release/app-release.aab
          java -jar /tmp/breeze-android-candidate/bundletool.jar dump manifest --bundle=android/app/build/outputs/bundle/release/app-release.aab > /tmp/breeze-android-candidate/AndroidManifest.xml
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab > /tmp/breeze-android-candidate/signature-verification.txt 2>&1
          cat android/app/build/outputs/logs/manifest-merger-release-report.txt
          python3 tools/verify-android-candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: breeze-android-1.9.2-code2-unsigned-${{ github.sha }}
          path: |
            /tmp/breeze-android-candidate/breeze-android-1.9.2-code2-unsigned.aab
            /tmp/breeze-android-candidate/android-candidate-provenance.json
            /tmp/breeze-android-candidate/AndroidManifest.xml
            /tmp/breeze-android-candidate/signature-verification.txt
            android/app/build/reports/lint-results-release.*
            android/app/build/test-results/testReleaseUnitTest/
          if-no-files-found: error
          retention-days: 7
