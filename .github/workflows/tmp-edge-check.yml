name: Temporary edge check
on:
  push:
    branches: [chatgpt/pure-ai-jev-reuse-20260921]
permissions:
  contents: read
jobs:
  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check server/dict/index.ts
