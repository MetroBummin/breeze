name: Text rotation source anchor
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
concurrency:
  group: text-rotation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  rotation:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.engine }}
      - uses: actions/checkout@v4
        with:
          ref: 8512e8fd25e51d6aa06cf926bad165d5c3994865
          path: baseline
          persist-credentials: false
      - name: Prove pre-fix browser reproducer fails for source drift
        run: |
          if BREEZE_ROTATION_SOURCE_ROOT="$PWD/baseline" BREEZE_ROTATION_CASE=race node tests/verify-text-rotation-browser.mjs > /tmp/text-rotation-before.log 2>&1; then
            cat /tmp/text-rotation-before.log
            echo 'Baseline unexpectedly passed the race reproducer'
            exit 1
          fi
          cat /tmp/text-rotation-before.log
          grep -q 'source paragraph moved' /tmp/text-rotation-before.log
      - name: Verify exact-head source and actual browser layout
        run: |
          node --test tests/verify-text-rotation.mjs tests/verify-text-anchor-restoration.mjs tests/verify-epub-navigation-motion.mjs tests/verify-pdf-session-regressions.mjs
          node tests/verify-text-rotation-browser.mjs
      - name: Existing full-app opening and navigation ownership
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
        run: node tests/verify-reader-restoration-navigation-browser.mjs
      - name: Rotation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-rotation-${{ matrix.engine }}
          path: |
            /tmp/breeze-text-rotation-*/
            /tmp/text-rotation-before.log
          retention-days: 7

  suite-status:
    needs: [changes, rotation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
