name: Sync safety

on:
  push:
    branches: [codex/sync-egress]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Preserve checked source and generated web version stamps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-checked-source
          retention-days: 1
          path: |
            index.html
            sw.js
            tsconfig.json
            scripts/
            tests/
            types/
            tools/stamp-version.mjs
