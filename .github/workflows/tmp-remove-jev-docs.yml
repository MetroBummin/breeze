name: Temporary regenerate docs after JEV removal

on:
  push:
    branches: [chatgpt/remove-jev-lookup-20260921]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-jev-lookup-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs
      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No generated docs changes"
          else
            git commit -m "docs: regenerate after JEV removal"
            git push origin HEAD:chatgpt/remove-jev-lookup-20260921
          fi
