name: Post270 gesture followup
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
concurrency:
  group: post270-gestures-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  browser:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      BROWSER: ${{ matrix.engine }}
      BREEZE_QA_ENGINE: ${{ matrix.engine }}
      BREEZE_MOTION_OUTPUT: /tmp/breeze-motion-proof/${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: browser
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.engine }}
      - run: node tests/verify-study-motion-browser.mjs
      - run: node tests/capture-study-handoff-browser.mjs
        if: ${{ !cancelled() && steps.browser.conclusion == 'success' && matrix.engine == 'chromium' }}
      - run: node tests/verify-pdf-elastic-motion-browser.mjs
        if: ${{ !cancelled() && steps.browser.conclusion == 'success' }}
      - run: npm run test:pdf-pinch
        if: ${{ !cancelled() && steps.browser.conclusion == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post270-motion-${{ matrix.engine }}
          path: /tmp/breeze-motion-proof/${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 14

  suite-status:
    needs: [changes, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
