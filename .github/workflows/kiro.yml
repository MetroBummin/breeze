# Kiro coding agent via kirodotdev-labs/kiro-action (headless Kiro CLI).
# Triggers (owner-only):
#   - add label `kiro-ci` to an issue or PR
#   - comment `/kiro-ci <지시>` on an issue / PR / PR review thread
# Uses `kiro-ci` / `/kiro-ci` instead of the default `kiro` / `/kiro`
# so it doesn't collide with the separate Kiro Web GitHub App.

name: Kiro CI

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

concurrency:
  group: kiro-ci-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  kiro:
    # Owner-only guard: this repo is public, so nobody else can spend Kiro credits.
    if: >-
      github.actor == 'MetroBummin' &&
      (
        ((github.event_name == 'issues' || github.event_name == 'pull_request') &&
          github.event.label.name == 'kiro-ci') ||
        ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          github.event.comment.author_association == 'OWNER' &&
          contains(github.event.comment.body, '/kiro-ci'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to release v0.2.1 (commit 3eba5e094a3d817d93eaba8f739db16d2135e6b5).
      - uses: kirodotdev-labs/kiro-action@3eba5e094a3d817d93eaba8f739db16d2135e6b5 # v0.2.1
        with:
          kiro_api_key: ${{ secrets.KIRO_API_KEY }}
          trigger_phrase: '/kiro-ci'
          label_trigger: 'kiro-ci'
          kiro_args: '--trust-all-tools --model claude-opus-5.5'
