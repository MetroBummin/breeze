name: Temporary typecheck detail
on:
  push:
    branches: [chatgpt/pure-ai-jev-reuse-20260921]
permissions:
  contents: read
jobs:
  tsc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --pretty false
