name: Word retry recovery
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
concurrency:
  group: word-retry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  recovery:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - name: Server morphology, logical recovery, quota and stale-context contracts
        run: |
          node tests/verify-word-lemma-validation.mjs
          node tests/verify-lookup-contract.mjs
          node tests/verify-word-lookup-recovery.mjs
          node --test tests/verify-word-auth-deadline.mjs
          node tests/verify-word-lookup-quota.mjs
          node tests/verify-word-lifecycle.mjs
          node tests/verify-lemma.mjs
          node tests/verify-word-spans.mjs
      - name: Actual mini and detail retry controls in Chromium and WebKit
        run: |
          status=0
          for engine in chromium webkit; do
            BROWSER=$engine timeout --verbose --kill-after=5s 120s node tests/verify-word-arrival-browser.mjs || status=1
          done
          exit "$status"
      - name: Repeat-tap cancellation and existing presentation/scroll regressions
        run: |
          node tests/verify-word-scroll-idle.mjs
          node tests/verify-reader-feedback.mjs
          node tests/verify-sentence-lifecycle.mjs
          status=0
          for engine in chromium webkit; do
            for test in verify-word-repeat-tap-browser verify-word-presentation-browser verify-word-scroll-idle-browser; do
              BROWSER=$engine timeout --verbose --kill-after=5s 240s node tests/$test.mjs || status=1
            done
          done
          exit "$status"
      - name: Verify the explicitly requested deployed dict runtime
        if: contains(github.event.pull_request.body, '[verify-dict-warm]')
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const endpoint='https://hrtfhojbhqvaoiulspto.supabase.co/functions/v1/dict';
          const receipt={checkedAt:new Date().toISOString(),sourceCommit:process.env.SOURCE_COMMIT,endpoint,operation:'warm',authenticated:false,scope:'existing pre-auth unmetered warm path',passed:false};
          try {
            // Existing warm handling returns before auth, provider, quota and DB operations.
            const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'warm'}),credentials:'omit',redirect:'error',signal:AbortSignal.timeout(20000)});
            receipt.status=response.status;
            assert.equal(response.status,200);
            const body=await response.json();
            assert.equal(body.ok,true);
            assert.equal(body.sentenceEasyExplanation,true);
            receipt.ok=body.ok;receipt.sentenceEasyExplanation=body.sentenceEasyExplanation;receipt.passed=true;
          } finally {
            writeFileSync('/tmp/breeze-dict-warm.json',JSON.stringify(receipt,null,2)+'\n');
            console.log(JSON.stringify(receipt));
          }
          NODE
      - name: Deployed dict runtime receipt
        if: always() && contains(github.event.pull_request.body, '[verify-dict-warm]')
        uses: actions/upload-artifact@v4
        with:
          name: breeze-dict-runtime-warm
          path: /tmp/breeze-dict-warm.json
          if-no-files-found: warn
          retention-days: 7

  suite-status:
    needs: [changes, recovery]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
