name: Apple 1.9.8 submit

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: submit:breeze-198 submits the approved 1.9.8 review; empty is read-only
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apple:
    if: github.repository == 'MetroBummin/breeze'
    environment: apple-release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.19.0'
      - name: Inventory the approved Cloud build and submit when confirmed
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_RELEASE_ENABLED: ${{ vars.ASC_RELEASE_ENABLED }}
          ASC_WRITES_ENABLED: ${{ vars.ASC_WRITES_ENABLED }}
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          CONFIRM: ${{ inputs.confirm }}
        run: node tools/apple-submit-198.mjs
