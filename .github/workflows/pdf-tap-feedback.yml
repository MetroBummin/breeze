name: PDF native tap feedback
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
concurrency:
  group: pdf-tap-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  regression:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.engine }}
      - run: node --test tests/verify-pdf-tap-feedback.mjs
      - name: Preserve the unprotected main CSS as the control
        run: git show 693488cfe25419654e91d5bf18a03cbb8d8d591c:styles/reader.css > /tmp/breeze-reader-before.css
      - name: Baseline native feedback and unchanged word/scroll behavior
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BREEZE_TAP_BASELINE: '1'
          BREEZE_TAP_READER_CSS: /tmp/breeze-reader-before.css
          BREEZE_TAP_PROOF: /tmp/breeze-pdf-tap-feedback
        run: timeout --kill-after=5s 300s node tests/verify-pdf-tap-feedback-browser.mjs
      - name: Fixed native feedback and unchanged word/scroll behavior
        if: ${{ !cancelled() }}
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BREEZE_TAP_PROOF: /tmp/breeze-pdf-tap-feedback
        run: timeout --kill-after=5s 300s node tests/verify-pdf-tap-feedback-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-tap-feedback-${{ matrix.engine }}
          path: /tmp/breeze-pdf-tap-feedback/
          if-no-files-found: error
          retention-days: 7

  suite-status:
    needs: [changes, regression]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
