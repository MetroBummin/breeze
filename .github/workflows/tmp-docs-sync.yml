name: Temporary docs sync
on:
  push:
    branches: [chatgpt/pure-ai-jev-reuse-20260921]
permissions:
  contents: write
jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pure-ai-jev-reuse-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run docs
      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dictionary.html docs/privacy.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: regenerate dictionary and privacy pages"
          git push origin HEAD:chatgpt/pure-ai-jev-reuse-20260921
