name: Temporary verify JEV removal

on:
  push:
    branches: [chatgpt/remove-jev-lookup-20260921]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-jev-lookup-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run checks and always publish result
        shell: bash
        run: |
          set +e
          npm ci
          CI_STATUS=$?
          TEST_STATUS=99
          WORD_STATUS=99
          if [ "$CI_STATUS" -eq 0 ]; then
            npm test
            TEST_STATUS=$?
            npx playwright install --with-deps chromium
            INSTALL_STATUS=$?
            if [ "$INSTALL_STATUS" -eq 0 ]; then
              npm run test:word
              WORD_STATUS=$?
            else
              WORD_STATUS=$INSTALL_STATUS
            fi
          fi
          printf 'npm_ci=%s\nnpm_test=%s\ntest_word=%s\n' "$CI_STATUS" "$TEST_STATUS" "$WORD_STATUS" > .github/jev-removal-verified
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/jev-removal-verified
          git commit -m "ci: record JEV removal verification"
          git push origin HEAD:chatgpt/remove-jev-lookup-20260921
          exit 0
