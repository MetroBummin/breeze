name: Temporary verify JEV removal

on:
  push:
    branches: [chatgpt/remove-jev-lookup-20260921]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-jev-lookup-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture npm test result
        shell: bash
        run: |
          set +e
          npm ci > /tmp/npm-ci.log 2>&1
          CI_STATUS=$?
          TEST_STATUS=99
          if [ "$CI_STATUS" -eq 0 ]; then
            npm test > /tmp/npm-test.log 2>&1
            TEST_STATUS=$?
          else
            cp /tmp/npm-ci.log /tmp/npm-test.log
          fi
          printf 'npm_ci=%s\nnpm_test=%s\n' "$CI_STATUS" "$TEST_STATUS" > .github/jev-removal-verified
          tail -n 220 /tmp/npm-test.log > .github/jev-removal-test.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/jev-removal-verified .github/jev-removal-test.log
          git commit -m "ci: capture JEV removal test failure"
          git push origin HEAD:chatgpt/remove-jev-lookup-20260921
          exit 0
