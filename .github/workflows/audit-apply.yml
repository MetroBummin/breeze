name: Apply verified audit edits
on:
  push:
    branches: [chatgpt/audit-hardening-20260925]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'MetroBummin/breeze' && github.event.head_commit.message == 'Stage audited hardening changes'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact source and apply reviewed edits
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          payload = base64.b64decode(''.join((root / '.audit-remediation' / ('part-'+str(i))).read_text() for i in range(6)), validate=True)
          assert hashlib.sha256(payload).hexdigest() == '4faeb9583e8e30c27cb5115fe63e3d68a8e51ceb33f16cf20645fef6975f94ca', 'Bundle integrity mismatch'
          rows = json.loads(gzip.decompress(payload))
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'audit-changes.json').write_text(json.dumps(rows))
          allowed = {'chatgpt/audit-hardening-20260925','codex/home-discovery-carousel','codex/article-preview-1-4','codex/ipad-pdf-annotation'}
          refreshed = {'codex/home-discovery-carousel':'9d03bdf5dcb9a3901b699d1a9aa3c26cd5638cad','codex/article-preview-1-4':'401dce191ebe9e33bb3b5116e7eb0dc911c1dd97','codex/ipad-pdf-annotation':'5dbfa6dec473eeb8e04cac989ba95726fc670b9d'}
          def cmd(args, cwd=root):
              subprocess.run(args, cwd=cwd, check=True)
          def out(args, cwd=root):
              return subprocess.check_output(args, cwd=cwd, text=True).strip()
          for row in rows:
              branch = row['branch']
              assert branch in allowed and branch != 'main'
              expected = os.environ['GITHUB_SHA'] if row['expected']=='STAGING' else refreshed.get(branch,row['expected'])
              current = out(['git','ls-remote','origin','refs/heads/'+branch]).split()[0]
              assert current == expected, 'Branch moved: '+branch+' '+current
              row['base'] = expected
          prepared = []
          for row in rows:
              branch = row['branch']
              cmd(['git','fetch','--no-tags','origin',branch])
              assert out(['git','rev-parse','FETCH_HEAD']) == row['base'], 'Branch moved during fetch'
              work = pathlib.Path(os.environ['RUNNER_TEMP']) / ('audit-'+row['name'])
              cmd(['git','worktree','add','--detach',str(work),row['base']])
              (work/'node_modules').symlink_to(root/'node_modules', target_is_directory=True)
              paths = []
              for item in row['files']:
                  path = pathlib.PurePosixPath(item['path'])
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in ('.git','.github','.audit-remediation')
                  target = work/path
                  old = target.read_bytes().decode('utf-8') if target.exists() else ''
                  if item['old'] is None:
                      assert not target.exists(), 'Unexpected existing path: '+str(path)
                  else:
                      assert hashlib.sha256(old.encode()).hexdigest()==item['old'], 'Old file mismatch: '+str(path)
                  for a,b,text in reversed(item['edits']):
                      assert 0 <= a <= b <= len(old)
                      old = old[:a]+text+old[b:]
                  assert hashlib.sha256(old.encode()).hexdigest()==item['new'], 'New file mismatch: '+str(path)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(old.encode())
                  paths.append(str(path))
              cmd(['node','tools/stamp-version.mjs'], work)
              cmd(['node','tools/build-docs.mjs'], work)
              cmd(['node','tools/typecheck.mjs'], work)
              test = {'core':'tests/verify-audit-hardening.mjs','20':'tests/verify-home-audit.mjs','21':'tests/verify-article-preview-server.mjs'}.get(row['name'])
              if test: cmd(['node','--test',test], work)
              cmd(['git','diff','--check'], work)
              cmd(['git','add','--']+paths, work)
              cmd(['git','add','-u','--','index.html','sw.js','docs'], work)
              cmd(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: address integrity audit ('+row['name']+')'], work)
              prepared.append((row,work))
          for row,work in prepared:
              current=out(['git','ls-remote','origin','refs/heads/'+row['branch']]).split()[0]
              assert current==row['base'], 'Concurrent change; refusing push: '+row['branch']
              cmd(['git','push','origin','HEAD:refs/heads/'+row['branch']],work)
              sha=out(['git','rev-parse','HEAD'],work)
              print('PUBLISHED',row['name'],row['branch'],sha,flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('- '+row['branch']+': `'+sha+'` (hash-verified edits, typecheck and targeted contracts)\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-remediation-proof
          retention-days: 1
          path: ${{ runner.temp }}/audit-changes.json
