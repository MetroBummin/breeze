name: Sentence responsive success pill
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
concurrency:
  group: sentence-success-pill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  browser:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/verify-sentence-success-pill.mjs
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Phone and iPad rendered previews
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BREEZE_QA_PREVIEW: '1'
          BREEZE_QA_OUTPUT: /tmp/breeze-sentence-success-preview
        run: node tests/verify-sentence-success-pill-browser.mjs
      - name: Early preview screenshots and real video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentence-success-preview-${{ matrix.engine }}
          path: /tmp/breeze-sentence-success-preview/
          if-no-files-found: warn
          retention-days: 7
      - name: Format, responsive geometry and lifetime matrix
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BREEZE_QA_OUTPUT: /tmp/breeze-sentence-success-proof
        run: node tests/verify-sentence-success-pill-browser.mjs
      - name: Downloadable geometry and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentence-success-reports-${{ matrix.engine }}
          path: /tmp/breeze-sentence-success-proof/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Full responsive proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentence-success-proof-${{ matrix.engine }}
          path: /tmp/breeze-sentence-success-proof/
          if-no-files-found: warn
          retention-days: 7

  suite-status:
    needs: [changes, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
