name: Sentence inline feedback
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
concurrency:
  group: sentence-inline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  browser:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    # Includes cold dependencies: Ubuntu mirror downloads alone reached 15 minutes.
    # Leave room for the unchanged ~5-minute WebKit test suite and cleanup.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.engine }}
      - name: Fast rendered phone preview
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BREEZE_QA_PREVIEW: '1'
          BREEZE_QA_OUTPUT: /tmp/breeze-sentence-phone-preview
        run: node tests/verify-sentence-inline-browser.mjs
      - name: Phone preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentence-phone-preview-${{ matrix.engine }}
          path: /tmp/breeze-sentence-phone-preview/
          if-no-files-found: warn
          retention-days: 7
      - name: Original production lookup appearance parity
        if: ${{ !cancelled() }}
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BREEZE_LOOKUP_TONE_PROOF: /tmp/breeze-light-lookup-tone
        run: |
          node tests/verify-light-lookup-tone.mjs
          node tests/verify-light-lookup-tone-browser.mjs
      - name: Original lookup parity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-lookup-tone-${{ matrix.engine }}
          path: /tmp/breeze-light-lookup-tone/
          if-no-files-found: warn
          retention-days: 7
      - name: WebKit same-fixture baseline comparison
        if: ${{ matrix.engine == 'webkit' && github.event_name == 'pull_request' && !cancelled() }}
        env:
          BREEZE_QA_ENGINE: webkit
          BREEZE_QA_BASELINE: '1'
          BREEZE_QA_ROOT: /tmp/breeze-sentence-before
          BREEZE_QA_OUTPUT: /tmp/breeze-sentence-text-before
          BREEZE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BREEZE_BASE_SHA"
          git worktree add --detach /tmp/breeze-sentence-before "$BREEZE_BASE_SHA"
          node tests/verify-sentence-text-ink-browser.mjs
      - name: WebKit baseline screenshots
        if: ${{ always() && matrix.engine == 'webkit' }}
        uses: actions/upload-artifact@v4
        with:
          name: sentence-text-before-webkit
          path: /tmp/breeze-sentence-text-before/
          if-no-files-found: warn
          retention-days: 7
      - name: Synthetic loading, errors and source ownership
        if: ${{ !cancelled() }}
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BREEZE_QA_OUTPUT: /tmp/breeze-sentence-inline-proof
        run: |
          node tests/verify-sentence-inline-browser.mjs
          node tests/verify-sentence-text-ink-browser.mjs
      - name: Home heading chevron alignment
        if: ${{ !cancelled() }}
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BREEZE_HOME_HEADING_PROOF: /tmp/breeze-sentence-inline-proof/home-headings
        run: node tests/verify-home-heading-browser.mjs
      - name: Existing sentence long-press and presentation regression
        env:
          BREEZE_QA_ENGINE: ${{ matrix.engine }}
          BROWSER: ${{ matrix.engine }}
        run: |
          node tests/verify-sentence-cue-browser.mjs
          node tests/verify-sentence-presentation-browser.mjs
      - name: Rendered screenshot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentence-inline-proof-${{ matrix.engine }}
          path: /tmp/breeze-sentence-inline-proof/
          if-no-files-found: warn
          retention-days: 7

  suite-status:
    needs: [changes, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
