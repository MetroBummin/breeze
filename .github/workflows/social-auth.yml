name: Social auth draft

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: social-auth-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  browser:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
      BREEZE_AUTH_INLINE_PROOF: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium webkit
      - run: node --test tests/verify-apple-login.mjs tests/verify-provider-artwork.mjs
      - run: node tests/verify-next-release-boundary.mjs
      - run: node tests/verify-email-login-browser.mjs
      - run: node tests/verify-social-login-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-auth-${{ matrix.browser }}
          path: /tmp/breeze-email-login-proof/
          if-no-files-found: ignore
          retention-days: 7

  ios-compile:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute production native callback policy with Foundation
        run: node tests/verify-auth-native-policy.mjs
      - run: npm run ios:sync
      - name: Compile draft for Simulator without signing or archiving
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/breeze-social-auth-ios
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  suite-status:
    needs: [changes, browser, ios-compile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
