name: Vocabulary study sets
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
concurrency:
  group: study-sets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  contracts:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/verify-study-sets.mjs tests/verify-study-sets-storage.mjs tests/verify-study-sets-ui.mjs tests/verify-study-example.mjs tests/verify-simple-study-session.mjs tests/verify-app-icon-family-scenes.mjs
      - run: npm test
      - run: npm run www
      - run: git diff --exit-code -- index.html sw.js
  browser:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.engine }}
      - run: node tests/capture-study-sets-browser.mjs
        env:
          BROWSER: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-sets-review-${{ matrix.engine }}
          path: /tmp/breeze-study-sets-proof/ui-set-*.png
          if-no-files-found: ignore
          retention-days: 14
      - run: node tests/verify-study-sets-browser.mjs
        env:
          BROWSER: ${{ matrix.engine }}
      - run: node tests/verify-study-create-browser.mjs
        env:
          BROWSER: ${{ matrix.engine }}
      - run: node tests/verify-study-quota-browser.mjs
        env:
          BROWSER: ${{ matrix.engine }}
      - run: node tests/verify-study-quota-browser.mjs
        env:
          BROWSER: ${{ matrix.engine }}
          BREEZE_QUOTA_LONG_EXAMPLES: '1'
      - run: node tests/verify-study-sets-touch-browser.mjs
        if: matrix.engine == 'chromium'
      - run: node tests/verify-study-session-swipe-browser.mjs
        if: matrix.engine == 'chromium'
      - run: node tests/capture-study-store-sources.mjs
        if: matrix.engine == 'chromium'
        env:
          BREEZE_STORE_CHECK_SIGNATURE: '1'
          BREEZE_STORE_SOURCE_OUTPUT: /tmp/breeze-signature-set
      - run: node tests/capture-study-store-sources.mjs
        if: matrix.engine == 'chromium'
        env:
          BREEZE_STORE_CHECK_SIGNATURE: '1'
          BREEZE_STORE_DOMAIN: all
          BREEZE_STORE_SOURCE_OUTPUT: /tmp/breeze-signature-all
      - run: node tests/verify-simple-word-cards-browser.mjs
        env:
          BROWSER: ${{ matrix.engine }}
      - run: node tests/capture-app-icon-family.mjs
        env:
          BROWSER: ${{ matrix.engine }}
          BREEZE_FAMILY_OUTPUT: /tmp/breeze-app-icon-family-${{ matrix.engine }}
      - run: node tests/verify-header-controls-browser.mjs
        env:
          BROWSER: ${{ matrix.engine }}
      - run: node tests/verify-control-optics-browser.mjs
        env:
          BROWSER: ${{ matrix.engine }}
      - run: node tests/verify-design-memory-browser.mjs
        env:
          BROWSER: ${{ matrix.engine }}
      - run: node tests/verify-wordbook-browser.mjs
        if: matrix.engine == 'chromium'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-sets-${{ matrix.engine }}
          path: |
            /tmp/breeze-study-sets-proof/
            /tmp/breeze-study-touch-preview/
            /tmp/breeze-study-session-proof/
            /tmp/breeze-app-icon-family-${{ matrix.engine }}/
            /tmp/breeze-header-controls/
            /tmp/breeze-control-optics/
            /tmp/breeze-signature-set/
            /tmp/breeze-signature-all/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-create-${{ matrix.engine }}
          path: /tmp/breeze-study-create-proof/
          if-no-files-found: warn
          retention-days: 14

  suite-status:
    needs: [changes, contracts, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed when suites passed or were skipped
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, info in needs.items():
              result = (info or {}).get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("Suites did not pass:", ", ".join(failed))
              sys.exit(1)
          print("Suites passed, or this pull request did not require them.")
          PY
